name: Continuous Delivery (GitHub Release)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deliver:
    name: Build and Publish Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Build release bundle
        run: |
          mkdir -p release_assets
          zip -r release_assets/classificador_condicao_medica-${{ github.ref_name }}.zip \
            src \
            tests \
            data/models \
            README.md \
            requirements.txt \
            docker-compose.yml \
            train_model.py

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: classificador-condicao-medica-${{ github.ref_name }}
          path: release_assets/*.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release_assets/*.zip
